name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize production migrations and deploys; never cancel an in-flight migration.
concurrency:
  group: cloudflare-production
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  migrate:
    if: vars.CLOUDFLARE_CUTOVER == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        # Only the db subtree, so a lapsed FontAwesome token cannot block migrations.
        run: pnpm install --frozen-lockfile --filter @auntie-marlenes/db...
      - name: Validate schema
        run: pnpm --filter @auntie-marlenes/db exec prisma validate
      - name: Check migrations on fresh local D1
        run: pnpm --filter @auntie-marlenes/db db:check-drift
      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @auntie-marlenes/db exec wrangler d1 migrations apply auntie-marlenes --remote

  web:
    if: vars.CLOUDFLARE_CUTOVER == 'true' && github.ref == 'refs/heads/main'
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma clients
        run: pnpm --filter @auntie-marlenes/db db:generate
      - name: Unit tests
        run: pnpm test --filter=@auntie-marlenes/web...
      - name: Build and deploy web
        # Only public build-time values here. Runtime secrets are Worker secrets
        # loaded from 1Password (apps/web/.env.op), never baked into the bundle.
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_SITE_URL: https://www.auntiemarlenes.com
          NEXT_PUBLIC_SANITY_PROJECT_ID: zm0a7rrv
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: '2026-01-01'
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST || '/relay-hyx5' }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          SHOPIFY_STOREFRONT_API_ENDPOINT: https://afro-hair-and-beauty.myshopify.com/api/2024-01/graphql.json
          SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Page-data collection imports modules that check these exist. Build-only
          # placeholders; the Worker reads the real values from its secrets.
          NEXT_AUTH_SECRET: placeholder-build-only
          GOOGLE_CLIENT_ID: placeholder
          GOOGLE_CLIENT_SECRET: placeholder
          CLOUDFLARE_EMAIL_API_TOKEN: placeholder-build-only-not-a-credential
        run: pnpm --filter @auntie-marlenes/web run deploy
