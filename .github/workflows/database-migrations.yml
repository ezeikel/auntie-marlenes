name: Database Migrations

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: '24'

jobs:
  validate-schema:
    # Hetzner CI box once the hosted allowance is used (docs/HETZNER_CI_RUNNER.md).
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    name: Validate and replay local D1 migrations
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
        run: pnpm install --frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm --filter @auntie-marlenes/db exec prisma validate
      - name: Check Prisma formatting
        run: pnpm --filter @auntie-marlenes/db exec prisma format --check
      - name: Check migration drift without credentials
        run: pnpm --filter @auntie-marlenes/db db:check-drift

# A6 wires production D1 migrations before deployment, behind the cutover gate.
# A1 is local-only: this workflow has no production migration job.
