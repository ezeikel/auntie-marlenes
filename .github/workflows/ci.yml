name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    name: Lint & Type Check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Unit tests
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    name: Build
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          # Placeholder env vars for build (validated at runtime, not build time).
          #
          # EXCEPTION — anything feeding a `generateStaticParams` must be REAL. Under
          # Next 16 Cache Components every `generateStaticParams` must return >=1 result,
          # so a placeholder backend returns nothing and the build hard-fails with
          # EmptyGenerateStaticParamsError. Two routes are affected:
          #   /[locale]/blog/[slug]     -> Sanity  (public project, world-readable dataset)
          #   /[locale]/product/[handle] -> Shopify (needs the storefront token secret)
          # (/[locale]/layout.tsx uses a static locale list, so it is always non-empty.)
          # The Sanity values below are public — they ship in the client bundle.
          NEXT_PUBLIC_SITE_URL: https://auntiemarlenes.com
          NEXT_PUBLIC_SANITY_PROJECT_ID: zm0a7rrv
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: '2026-01-01'
          NEXT_PUBLIC_POSTHOG_KEY: placeholder
          NEXT_PUBLIC_POSTHOG_HOST: /relay-hyx5
          SHOPIFY_STOREFRONT_API_ENDPOINT: https://afro-hair-and-beauty.myshopify.com/api/2024-01/graphql.json
          SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          NEXT_AUTH_SECRET: placeholder-ci-secret
          GOOGLE_CLIENT_ID: placeholder
          GOOGLE_CLIENT_SECRET: placeholder
          RESEND_API_KEY: re_placeholder
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm build
